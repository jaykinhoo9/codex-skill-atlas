name: Verify clean release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
      - run: python3 scripts/check_release.py
      - run: python3 scripts/build_release.py
